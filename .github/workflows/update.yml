name: update
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sing-box
        run: |
          V=1.11.4
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v$V/sing-box-$V-linux-amd64.tar.gz | tar xz
          sudo mv sing-box-$V-linux-amd64/sing-box /usr/local/bin/
      - run: python build/main.py
      - run: python build/sub_link.py refresh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Commit output
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add out state
          if ! git diff --cached --quiet; then
            git commit -m "update configs"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
