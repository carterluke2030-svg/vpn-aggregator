name: update
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sing-box
        run: |
          V=1.11.4
          curl -sL https://github.com/SagerNet/sing-box/releases/download/v$V/sing-box-$V-linux-amd64.tar.gz | tar xz
          sudo mv sing-box-$V-linux-amd64/sing-box /usr/local/bin/
      - run: python build/main.py
        env:
          PERSONAL_ID: ${{ secrets.PERSONAL_ID }}
      - name: Commit output
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          # build output is regenerated wholesale, so rebase onto the latest main
          # and lay our files on top instead of merging
          keep=$RUNNER_TEMP/keep
          mkdir -p $keep/out $keep/state
          cp -r out/sub.txt out/singbox.json out/me $keep/out/ 2>/dev/null || true
          cp state/history.json $keep/state/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r $keep/out/. out/ && cp -r $keep/state/. state/
            python build/sub_link.py refresh
            git add out state
            git diff --cached --quiet && exit 0
            git commit -qm "update configs"
            git push && exit 0
            sleep 10
          done
          exit 1
